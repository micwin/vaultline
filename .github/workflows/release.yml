name: Release vaultline

on:
  push:
    branches:
      - release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Determine version
        id: vars
        run: |
          VERSION=$(grep 'const Version' pkg/version/version.go | awk -F'"' '{print $2}')
          if [[ -z "${VERSION}" ]]; then
            echo "Version not found" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build artifacts
        run: ./scripts/build.sh --deb --site --version "${{ steps.vars.outputs.version }}"

      - name: Create git tag
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Prepare release notes body
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          NOTES_SOURCE="site-src/release-notes/v${VERSION}.md"
          NOTES_OUT="dist/release-notes.md"
          if [[ ! -f "${NOTES_SOURCE}" ]]; then
            echo "Release notes file not found: ${NOTES_SOURCE}" >&2
            exit 1
          fi

          # Strip optional Jekyll frontmatter and write a plain markdown body.
          awk '
            BEGIN { in_frontmatter = 0; frontmatter_done = 0 }
            NR == 1 && $0 == "---" { in_frontmatter = 1; next }
            in_frontmatter && $0 == "---" { in_frontmatter = 0; frontmatter_done = 1; next }
            !in_frontmatter { print }
          ' "${NOTES_SOURCE}" > "${NOTES_OUT}"

          if [[ ! -s "${NOTES_OUT}" ]]; then
            echo "Prepared release notes are empty" >&2
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.vars.outputs.version }}
          name: vaultline v${{ steps.vars.outputs.version }}
          body_path: dist/release-notes.md
          files: |
            dist/vaultline_${{ steps.vars.outputs.version }}_amd64.deb
            dist/vaultline
          draft: false
          prerelease: false

      - name: Deploy Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: ./site
